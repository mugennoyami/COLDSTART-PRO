name: GitHub Pages

# Veröffentlicht den Ordner dist/ (App, Katalogdaten und Bilder) unter
# https://mugennoyami.github.io/COLDSTART-PRO/
# Voraussetzung: Settings → Pages → Build and deployment → Source „GitHub Actions“.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Nur eine Veröffentlichung gleichzeitig; eine laufende wird nicht abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: App bauen, testen und Seite verpacken
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Auslieferbare HTML-Datei bauen
        run: node build.mjs
      - name: Automatisierte Tests ausführen
        run: node --test tests/*.test.mjs
      - name: Versionierte HTML-Datei auf Aktualität prüfen
        run: git diff --exit-code -- dist/index.html
      - name: Ordner dist als Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Auf GitHub Pages veröffentlichen
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
